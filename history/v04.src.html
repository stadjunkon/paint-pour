<title>Paint Pour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600&display=swap">
<style>
/* Layout: white canvas, photo centred with 40px corners, a single pour button under it; one full-screen WebGL pass draws photo and liquid */
:root {
  --paper: #fafaf8;
  --ink: #111114;
  --on-ink: #fafaf8;
  --paint: #1440f0;
  --focus: #1440f0;
  --ui: "Onest", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--ui);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.pour {
  position: fixed;
  left: 50%;
  top: 0;
  transform: translate(-50%, 0);
  display: inline-flex;
  align-items: center;
  gap: 10px;
  height: 52px;
  padding: 0 24px 0 18px;
  border: 0;
  border-radius: 999px;
  background: var(--ink);
  color: var(--on-ink);
  font: 600 16px/1 var(--ui);
  letter-spacing: -0.005em;
  white-space: nowrap;
  cursor: pointer;
  transition: transform .18s cubic-bezier(.3,1.6,.5,1), opacity .3s;
}
.pour:hover { transform: translate(-50%, -2px); }
.pour:active, .pour.kick { transform: translate(-50%, 2px) scale(.94); }
.pour:disabled { cursor: default; }
.pour:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.pour .drop {
  width: 14px; height: 14px;
  background: var(--paint);
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
}
.fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink); }
</style>

<canvas id="gl" aria-label="Фотография, на которую выплёскивают краску, и она становится цветной"></canvas>
<button class="pour" id="pour" type="button"><span class="drop" aria-hidden="true"></span><span id="label">Залить краской</span></button>
<div class="fallback" id="fallback" hidden>Этому браузеру не хватает WebGL2, поэтому эффект не запустится.</div>

<script id="vs" type="x-shader/x-vertex">#version 300 es
in vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0., 1.); }
</script>
<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 outColor;
uniform sampler2D uImg;
uniform vec2  uCenter;   // photo centre, device px (GL origin)
uniform float uPH;       // photo height, device px
uniform float uAsp;      // photo width / height
uniform float uRad;      // corner radius, photo units
uniform vec2  uBtn;      // button centre, photo units
uniform vec2  uHit;      // impact point, photo units
uniform float uT;        // seconds since the throw, < 0 before
uniform float uFly;      // flight time
uniform float uDrain;    // 0..1 pulls the liquid back
uniform float uSeed;
uniform float uGrain;

const vec3 LW = vec3(.2126, .7152, .0722);
const vec3 PAINT = vec3(.08, .25, .98);
const vec3 L1 = normalize(vec3(-.5, .7, .55));
const vec3 L2 = normalize(vec3(.6, -.5, .6));

float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.-2.*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), u.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y);
}
float fbm(vec2 p){ float v = 0., a = .5; for (int i=0; i<4; i++){ v += a*noise(p); p = p*2.03 + 17.1; a *= .5; } return v; }
float soft(vec2 p){ return .66*noise(p) + .34*noise(p*2.03 + 17.1); }
float smax(float a, float b, float k){ float h = max(k-abs(a-b), 0.)/k; return max(a,b) + h*h*k*.25; }
float sdRound(vec2 p, vec2 b, float r){ vec2 d = abs(p) - b + r; return length(max(d, 0.)) + min(max(d.x, d.y), 0.) - r; }

vec2 toUV(vec2 q){ return clamp(vec2(q.x/uAsp + .5, q.y + .5), 0., 1.); }

vec3 vivid(vec3 c){
  float l = dot(c, LW);
  return clamp((mix(vec3(l), c, 1.28) - .5)*1.06 + .51, 0., 1.);
}
vec3 negative(vec3 c){
  vec3 n = 1. - c;
  return mix(mix(vec3(dot(n, LW)), n, .12)*vec3(.985, .985, .975), vec3(1.), .08);
}

// ---- the flood: a smooth, slowly morphing liquid front ----
float body(vec2 q, float R, float amp, float tau){
  vec2 d = q - uHit;
  float dist = sqrt(dot(d, d) + .0016);   // softened so the impact point has no pinch
  vec2 dir = d/dist;
  float lobes   = soft(dir*1.5 + uSeed + tau*.12) - .5;
  float fingers = noise(dir*3.2 + uSeed*2. - tau*.18) - .5;
  float wob     = noise(q*2.5 + uSeed + tau*.1) - .5;
  float ang = smoothstep(.02, .3, dist);   // shape the rim, keep the centre a smooth dome
  return R - dist + amp*ang*(.8*lobes + .12*fingers) + .015*wob - uDrain*2.4;
}
// lens thickness: a rounded lip right at the front that thins out behind it
float lip(float F){ return smoothstep(0., .045, F)*exp(-max(F - .045, 0.)/.13); }

// ---- the thrown drop: a glass bead that stretches with speed and jiggles ----
vec2 flyPos(float t){
  float k = clamp(t/uFly, 0., 1.);
  vec2 p = mix(uBtn, uHit, 1. - pow(1.-k, 2.));
  p.x += sin(k*3.14159)*.05*sign(uHit.x + .001);
  return p;
}
// signed distance to an ellipse stretched along the travel axis, with a short soft tail
float dropSD(vec2 q, vec2 c, vec2 ax, float r, float s){
  vec2 rel = q - c;
  vec2 l = vec2(dot(rel, ax), dot(rel, vec2(-ax.y, ax.x)));
  float a = r*s, b = r/sqrt(s);
  float de = (length(l/vec2(a, b)) - 1.)*min(a, b);
  float dt = length(l + vec2(a*.9, 0.)) - r*.45;
  float k = r*.9;
  float h = clamp(.5 + .5*(dt - de)/k, 0., 1.);
  return mix(dt, de, h) - k*h*(1. - h);
}
// bead height above the surface for a given inside depth
float beadH(float D, float r){ float x = clamp(-D, 0., r); return sqrt(x*(2.*r - x)); }

vec3 photoBefore(vec2 q, float grain){
  return negative(texture(uImg, toUV(q)).rgb) + grain*.03;
}
vec3 surfaceAt(vec2 q, vec3 paper){
  float m = smoothstep(.002, -.002, sdRound(q, vec2(uAsp*.5, .5), uRad));
  return mix(paper, photoBefore(q, 0.), m);
}

void main(){
  vec2 q = (gl_FragCoord.xy - uCenter)/uPH;
  vec2 hb = vec2(uAsp*.5, .5);
  float px = 1./uPH;
  float tau = uT - uFly;
  float grain = hash(gl_FragCoord.xy + uGrain) - .5;
  vec3 paper = vec3(.98, .98, .972) + grain*.008;

  float sd = sdRound(q, hb, uRad);
  float mask = smoothstep(px, -px, sd);

  // ---- photo + liquid ----
  vec3 photo = photoBefore(q, grain);
  float R = 0., amp = 0.;
  if (tau > 0.){
    float splat = .11*(1. - exp(-tau*20.));
    float flow  = 1.05*(1. - pow(1. - clamp(tau/3.8, 0., 1.), 1.6));
    float fill  = smoothstep(3.2, 4.4, tau)*.8;
    R = splat + flow + fill;
    amp = min(R, .3);
  }
  if (tau > 0. || uDrain > 0.){
    float e = 1.5*px;
    float F  = body(q, R, amp, tau);
    float Fx = body(q + vec2(e, 0.), R, amp, tau);
    float Fy = body(q + vec2(0., e), R, amp, tau);
    float h = lip(F);
    vec2 gh = vec2(lip(Fx) - h, lip(Fy) - h)/e;
    vec3 n = normalize(vec3(-gh*.03, 1.));
    float wet = smoothstep(-px, px, F);

    // refraction with a little chromatic split
    vec2 off = n.xy*(.07 + .06*h);
    vec3 cr = vivid(texture(uImg, toUV(q - off*.92)).rgb);
    vec3 cg = vivid(texture(uImg, toUV(q - off*1.05)).rgb);
    vec3 cb = vivid(texture(uImg, toUV(q - off*1.2)).rgb);
    vec3 liquid = vec3(cr.r, cg.g, cb.b);

    // thick glass carries a cool tint
    liquid = mix(liquid, liquid*vec3(.7, .82, 1.2) + PAINT*.1, h*.55);
    // fresnel rim and two specular lights
    float fres = pow(1. - n.z, 1.6);
    liquid += fres*vec3(.75, .86, 1.)*1.1;
    vec3 V = vec3(0, 0, 1);
    liquid += pow(max(dot(reflect(-L1, n), V), 0.), 70.)*1.3;
    liquid += pow(max(dot(reflect(-L2, n), V), 0.), 30.)*.35*vec3(.8, .9, 1.);
    // caustic: light gathered just inside the lip
    liquid += smoothstep(.0, .5, h)*(1. - smoothstep(.5, 1., h))*max(dot(n.xy, -L1.xy), 0.)*.18;

    // soft contact shadow cast ahead of the front
    float Fs = body(q + vec2(-.007, .011), R, amp, tau);
    float shade = lip(Fs)*(1. - wet)*.22;
    photo = mix(photo*(1. - shade), liquid, wet);
  }
  vec3 col = mix(paper, photo, mask);

  // ---- the thrown drop: blue glass bead with its shadow and caustic ----
  if (uT > 0. && tau < .09){
    float k = clamp(uT/uFly, 0., 1.);
    vec2 c = flyPos(uT);
    vec2 v = (c - flyPos(uT - .016))/.016;
    float sp = length(v);
    vec2 ax = sp > 1e-3 ? v/sp : vec2(0., 1.);
    float imp = smoothstep(0., .09, tau);                    // impact: flatten and hand over to the puddle
    float jig = sin(uT*38.)*exp(-uT*5.)*.12;
    float s = mix(1. + min(sp*.1, .4) + jig, .55, imp);
    float r = .05*(.72 + .38*sin(k*3.14159))*(1. + imp*.8);  // swells as it rises toward the viewer
    float lift = sin(k*3.14159)*(1. - imp);

    // soft shadow on the surface, with the light the bead focuses into it
    vec2 sc = c + vec2(.03, -.045)*(.25 + lift);
    float sdist = length((q - sc)/vec2(1.15, 1.))/(r*(1. + .7*lift));
    col *= 1. - (1. - smoothstep(.2, 1.25, sdist))*(.32 - .12*lift)*(1. - imp);
    float caus = exp(-pow(length(q - sc + vec2(.012, -.016)*(.4 + lift))/(r*.32), 2.));
    col += vec3(.3, .5, 1.)*caus*.5*(1. - imp);

    // the bead: refracts what is under it, blue deepens with thickness
    float e = 1.5*px;
    float D  = dropSD(q, c, ax, r, s);
    float h0 = beadH(D, r);
    float hx = beadH(dropSD(q + vec2(e, 0.), c, ax, r, s), r);
    float hy = beadH(dropSD(q + vec2(0., e), c, ax, r, s), r);
    vec3 n = normalize(vec3(-(hx - h0)/e, -(hy - h0)/e, 1.));
    float th = h0/r;
    vec2 off = n.xy*r*1.6;
    vec3 g = vec3(surfaceAt(q - off*.9, paper).r, surfaceAt(q - off, paper).g, surfaceAt(q - off*1.14, paper).b);
    // clear in the middle, deeper blue toward the rim where the light travels further
    g *= exp(-(1. - PAINT)*(.55 + 1.6*pow(1. - th, 2.))*1.25);
    g = mix(g, PAINT*.3, pow(1. - n.z, 3.)*.55);
    vec3 V = vec3(0, 0, 1);
    g += smoothstep(.86, .93, dot(n, normalize(vec3(-.42, .5, .76))))*.55;          // softbox reflection
    g += pow(max(dot(reflect(-L1, n), V), 0.), 220.)*2.;                              // sharp glint
    g += pow(max(dot(n.xy, -L1.xy), 0.), 1.5)*(1. - n.z)*vec3(.5, .75, 1.)*.9;        // light focused on the far side
    col = mix(col, g, smoothstep(px, -px, D)*(1. - smoothstep(.6, 1., imp)));
  }

  outColor = vec4(col, 1.);
}
</script>

<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SPEED = reduced ? 2.5 : 1;
  const FLY = 0.5;
  const DONE = 4.6;
  const RADIUS = 40;

  const canvas = document.getElementById('gl');
  const btn = document.getElementById('pour');
  const label = document.getElementById('label');

  const gl = canvas.getContext('webgl2', { antialias: false });
  if (!gl) { document.getElementById('fallback').hidden = false; btn.hidden = true; return; }

  const sh = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src.trim());
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, document.getElementById('vs').textContent));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  ['uImg','uCenter','uPH','uAsp','uRad','uBtn','uHit','uT','uFly','uDrain','uSeed','uGrain'].forEach(n => U[n] = gl.getUniformLocation(prog, n));

  let asp = 1200 / 1630;
  const tex = gl.createTexture();
  const img = new Image();
  img.onload = () => {
    asp = img.naturalWidth / img.naturalHeight;
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    layout();
  };
  img.src = 'data:image/jpeg;base64,__IMG__';

  // ---- layout: photo centred, button 32px under it ----
  const GAP = 32, BTN_H = 52;
  let L = { cx: 0, cy: 0, h: 1, btnY: 0 };
  function layout() {
    const vw = innerWidth, vh = innerHeight;
    const pad = Math.max(24, vh * 0.05);
    let h = Math.min(vh - pad * 2 - GAP - BTN_H, 900);
    if (h * asp > vw - 32) h = (vw - 32) / asp;
    h = Math.max(h, 120);
    const top = (vh - (h + GAP + BTN_H)) / 2;
    L = { cx: vw / 2, cy: top + h / 2, h, btnY: top + h + GAP + BTN_H / 2 };
    btn.style.top = (L.btnY - BTN_H / 2) + 'px';
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
  }
  addEventListener('resize', layout);
  layout();

  // ---- state ----
  const clock = () => performance.now() / 1000;
  let start = null;          // time of the throw
  let drainFrom = null;
  let seed = 3.7, hit = [0.03, -0.06];

  function throwPaint() {
    seed = Math.random() * 40 + 1;
    hit = [(Math.random() - 0.5) * 0.16, -0.04 + (Math.random() - 0.5) * 0.12];
    start = clock();
    btn.disabled = true;
    btn.classList.add('kick');
    setTimeout(() => btn.classList.remove('kick'), 160);
  }
  btn.addEventListener('click', () => {
    if (start === null) return throwPaint();
    drainFrom = clock();
    btn.disabled = true;
  });

  function frame() {
    const now = clock();
    let t = start === null ? -1 : (now - start) * SPEED;
    let drain = 0;
    if (drainFrom !== null) {
      const k = Math.min(1, (now - drainFrom) / (reduced ? 0.4 : 1.1));
      drain = k * k * (3 - 2 * k);
      if (k >= 1) { drainFrom = null; drain = 0; throwPaint(); t = 0; }
    }
    if (start !== null && drainFrom === null && t > DONE && btn.disabled) {
      btn.disabled = false;
      label.textContent = 'Ещё раз';
    }

    const dpr = canvas.width / innerWidth;
    // a short jolt on impact
    const tau = t - FLY;
    const jolt = !reduced && tau > 0 ? Math.exp(-tau * 16) * Math.sin(tau * 75) * 3 : 0;

    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform1i(U.uImg, 0);
    gl.uniform2f(U.uCenter, L.cx * dpr, (innerHeight - L.cy + jolt) * dpr);
    gl.uniform1f(U.uPH, L.h * dpr);
    gl.uniform1f(U.uAsp, asp);
    gl.uniform1f(U.uRad, RADIUS / L.h);
    gl.uniform2f(U.uBtn, 0, -(L.btnY - L.cy) / L.h);
    gl.uniform2f(U.uHit, hit[0], hit[1]);
    gl.uniform1f(U.uT, t);
    gl.uniform1f(U.uFly, FLY);
    gl.uniform1f(U.uDrain, drain);
    gl.uniform1f(U.uSeed, seed);
    gl.uniform1f(U.uGrain, Math.floor(now * 24) % 97);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
