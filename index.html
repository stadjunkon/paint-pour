<title>Paint Pour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600&display=swap">
<style>
/* Layout: one app screen (390x844 phone frame on desktop, full screen on a phone): status bar, photo card, primary button */
:root {
  --page: #08090c;
  --screen: #0e0f13;
  --bezel: #1b1c21;
  --bezel-edge: #2c2d33;
  --text: #f4f4f6;
  --btn: #f4f4f6;
  --btn-text: #0e0f13;
  --focus: #6e8bff;
  --ui: "Onest", -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--page);
  color: var(--text);
  font-family: var(--ui);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.device {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 390px;
  height: 844px;
  transform-origin: 50% 50%;
  border-radius: 56px;
  overflow: hidden;
  background: var(--screen);
  box-shadow: 0 0 0 11px var(--bezel), 0 0 0 12px var(--bezel-edge), 0 40px 120px rgba(0, 0, 0, .6);
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.status {
  position: absolute;
  inset: 0 0 auto;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 34px 0 46px;
  font: 600 16px/1 var(--ui);
  letter-spacing: -0.01em;
  pointer-events: none;
}
.island {
  position: absolute;
  top: 11px;
  left: 50%;
  width: 124px;
  height: 36px;
  margin-left: -62px;
  border-radius: 20px;
  background: #000;
}
.status svg { display: block; fill: var(--text); }
.status .icons { display: flex; gap: 6px; align-items: center; }
.home {
  position: absolute;
  bottom: 8px;
  left: 50%;
  width: 134px;
  height: 5px;
  margin-left: -67px;
  border-radius: 3px;
  background: var(--text);
  opacity: .85;
  pointer-events: none;
}
.pour {
  position: absolute;
  left: 16px;
  right: 16px;
  height: 56px;
  border: 0;
  border-radius: 999px;
  background: var(--btn);
  color: var(--btn-text);
  font: 600 17px/1 var(--ui);
  letter-spacing: -0.01em;
  cursor: pointer;
  transition: transform .18s cubic-bezier(.3,1.6,.5,1), opacity .3s;
}
.pour:active, .pour.kick { transform: scale(.96); }
.pour:disabled { cursor: default; }
.pour:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
/* on an actual phone the app takes the whole screen and the OS draws its own status bar */
body.mobile .device { left: 0; top: 0; border-radius: 0; box-shadow: none; }
body.mobile .status, body.mobile .home { display: none; }
.hint {
  position: absolute;
  left: 50%;
  top: 50%;
  display: grid;
  justify-items: center;
  gap: 14px;
  transform: translate(-50%, -50%) scale(.88);
  opacity: 0;
  pointer-events: none;
  transition: opacity .28s ease, transform .4s cubic-bezier(.3,1.5,.5,1);
}
.hint.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.hint-badge {
  width: 104px;
  height: 104px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(14, 15, 19, .55);
  backdrop-filter: blur(18px) saturate(1.4);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14), 0 12px 40px rgba(0, 0, 0, .35);
}
.hint svg { overflow: visible; }
.hint .phone { transform-origin: 32px 46px; animation: wiggle .38s ease-in-out infinite alternate; }
.hint .arc { animation: pulse .38s ease-in-out infinite alternate; }
.hint .arc.r { animation-delay: .19s; }
.hint-label {
  padding: 9px 16px;
  border-radius: 999px;
  background: rgba(14, 15, 19, .55);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12);
  font: 600 15px/1 var(--ui);
  letter-spacing: -0.01em;
  color: var(--text);
  white-space: nowrap;
}
@keyframes wiggle { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
@keyframes pulse { from { opacity: .25; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .hint .phone, .hint .arc { animation: none; } }
.fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
</style>

<div class="device" id="device">

      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.6c2.3 0 4.4.9 6 2.4l1.3-1.3A10.4 10.4 0 0 0 8 .8 10.4 10.4 0 0 0 .7 3.7L2 5c1.6-1.5 3.7-2.4 6-2.4Zm0 3.5c1.3 0 2.5.5 3.4 1.3l1.3-1.3A6.6 6.6 0 0 0 8 4.3a6.6 6.6 0 0 0-4.7 1.8l1.3 1.3C5.5 6.6 6.7 6.1 8 6.1Zm0 3.4c-.5 0-1 .2-1.3.5L8 11.3 9.3 10c-.3-.3-.8-.5-1.3-.5Z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" stroke-opacity=".4" style="stroke:var(--text)"/><rect x="2" y="2" width="20" height="9" rx="2.4"/><rect x="25" y="4.5" width="1.6" height="4" rx=".8" opacity=".4"/></svg>

<script id="vs" type="x-shader/x-vertex">#version 300 es
in vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0., 1.); }
</script>
<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 outColor;
uniform sampler2D uImg;
uniform vec2  uCenter;   // photo centre, device px (GL origin)
uniform float uPH;       // photo height, device px
uniform float uAsp;      // photo width / height
uniform float uRad;      // corner radius, photo units
uniform vec2  uBtn;      // button centre, photo units
uniform vec2  uHit;      // impact point, photo units
uniform float uT;        // seconds since the throw, < 0 before
uniform float uFly;      // flight time
uniform float uDrain;    // 0..1 pulls the liquid back
uniform float uSeed;
uniform float uGrain;
uniform float uImgAsp;   // image width / height
uniform float uFocusX;   // horizontal crop focus, 0..1
uniform vec3  uBg;       // screen background
uniform float uShed;     // 1 while the paint is being shaken off
uniform float uShedT;    // seconds since the shake began
uniform float uSwing;    // shake period, seconds
uniform vec2  uSlosh;    // paint lagging behind the shaking phone, photo units

const vec3 LW = vec3(.2126, .7152, .0722);
const vec3 PAINT = vec3(.08, .62, .9);
const vec3 L1 = normalize(vec3(-.5, .7, .55));
const vec3 L2 = normalize(vec3(.6, -.5, .6));

float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.-2.*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), u.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y);
}
float fbm(vec2 p){ float v = 0., a = .5; for (int i=0; i<4; i++){ v += a*noise(p); p = p*2.03 + 17.1; a *= .5; } return v; }
float soft(vec2 p){ return .66*noise(p) + .34*noise(p*2.03 + 17.1); }
float smax(float a, float b, float k){ float h = max(k-abs(a-b), 0.)/k; return max(a,b) + h*h*k*.25; }
float sdRound(vec2 p, vec2 b, float r){ vec2 d = abs(p) - b + r; return length(max(d, 0.)) + min(max(d.x, d.y), 0.) - r; }

// cover-fit the image into the card, cropping around uFocusX
vec2 toUV(vec2 q){
  vec2 uv;
  if (uAsp > uImgAsp) uv = vec2(q.x/uAsp + .5, q.y*uImgAsp/uAsp + .5);
  else { float hw = .5*uAsp/uImgAsp; uv = vec2(q.x/uImgAsp + clamp(uFocusX, hw, 1. - hw), q.y + .5); }
  return clamp(uv, 0., 1.);
}

vec3 vivid(vec3 c){
  float l = dot(c, LW);
  return clamp((mix(vec3(l), c, 1.28) - .5)*1.06 + .51, 0., 1.);
}
vec3 negative(vec3 c){
  vec3 n = 1. - c;
  return vec3(dot(n, LW))*vec3(.9, .905, .92);
}

// ---- the flood: a smooth, slowly morphing liquid front ----
float body(vec2 q, float R, float amp, float tau){
  vec2 d = q - uHit;
  float dist = sqrt(dot(d, d) + .0016);   // softened so the impact point has no pinch
  vec2 dir = d/dist;
  float lobes   = soft(dir*1.5 + uSeed + tau*.12) - .5;
  float fingers = noise(dir*3.2 + uSeed*2. - tau*.18) - .5;
  float wob     = noise(q*2.5 + uSeed + tau*.1) - .5;
  float ang = smoothstep(.02, .3, dist);   // shape the rim, keep the centre a smooth dome
  return R - dist + amp*ang*(.8*lobes + .12*fingers) + .015*wob - uDrain*2.4;
}
// lens thickness: a rounded lip right at the front that thins out behind it
float lip(float F){ return smoothstep(0., .045, F)*exp(-max(F - .045, 0.)/.13); }

// ---- the thrown drop: a glass bead that stretches with speed and jiggles ----
vec2 flyPos(float t){
  float k = clamp(t/uFly, 0., 1.);
  vec2 p = mix(uBtn, uHit, 1. - pow(1.-k, 2.));
  p.x += sin(k*3.14159)*.05*sign(uHit.x + .001);
  return p;
}
// signed distance to an ellipse stretched along the travel axis, with a short soft tail
float dropSD(vec2 q, vec2 c, vec2 ax, float r, float s){
  vec2 rel = q - c;
  vec2 l = vec2(dot(rel, ax), dot(rel, vec2(-ax.y, ax.x)));
  float a = r*s, b = r/sqrt(s);
  float de = (length(l/vec2(a, b)) - 1.)*min(a, b);
  float dt = length(l + vec2(a*.9, 0.)) - r*.45;
  float k = r*.9;
  float h = clamp(.5 + .5*(dt - de)/k, 0., 1.);
  return mix(dt, de, h) - k*h*(1. - h);
}
// bead height above the surface for a given inside depth
float beadH(float D, float r){ float x = clamp(-D, 0., r); return sqrt(x*(2.*r - x)); }

// ---- shaken off as a liquid: the film sloshes, blobs are flung from it on each swing ----
// film: what is left on the photo; B: flying blobs; bc: their colour (taken from where they came from)
void shedField(vec2 q, out float film, out float B, out vec3 bc){
  vec2 qf = q - uSlosh;
  float th = .3 + .48*smoothstep(.25, .95, uShedT);           // the film beads up and drains away
  film = min(-sdRound(qf, vec2(uAsp*.5, .5), uRad), (fbm(qf*2.4 + uSeed) - th)*.35);
  B = -1.;
  vec3 acc = vec3(0.); float wsum = 0.;
  for (int i=0; i<30; i++){
    float fi = float(i);
    float h1 = hash(vec2(fi, uSeed)), h2 = hash(vec2(uSeed + 1., fi)), h3 = hash(vec2(fi*1.3, uSeed + 2.)), h4 = hash(vec2(fi*.7, uSeed + 5.));
    float side = mod(fi, 2.) < .5 ? -1. : 1.;
    // right swing peaks at a quarter period, left at three quarters; the first swing only sloshes
    float dt = uShedT - (uSwing*((side > 0. ? .25 : .75) + 1. + floor(h3*3.)) + .03*h4);
    if (dt <= 0.) continue;
    // tongues spill over the edge the phone swung toward, then break into drops
    vec2 src = vec2(side*uAsp*.5*(.9 + .08*h1), (h2 - .5)*.94);
    float r = (.04 + .05*h4)*(1. - .35*smoothstep(.15, .5, dt));
    float v = 2.8 + 2.6*h2;
    vec2 vel = vec2(side*v, .5*(h1 - .3) - 5.*dt);
    vec2 pos = src + uSlosh + vec2(side*v*dt, .5*(h1 - .3)*dt - 2.5*dt*dt);
    float sp = length(vel);
    float st = 1. + min(sp*.5, 2.)*smoothstep(0., .04, dt);            // drawn out by its speed
    float f = -dropSD(q, pos, vel/sp, r, st);
    // a neck of paint still ties it to the film edge, thins out and snaps
    float neck = r*.5*(1. - smoothstep(0., .1, dt));
    if (neck > .001){
      vec2 a = vec2(side*uAsp*.5, src.y) + uSlosh, ba = pos - a, pa = q - a;
      float k = clamp(dot(pa, ba)/dot(ba, ba), 0., 1.);
      f = smax(f, neck*(.6 + .4*k) - length(pa - ba*k), .02);
    }
    B = smax(B, f, .035);
    float w = exp(clamp(f, -.2, .2)*40.);
    acc += mix(vec3(.12, .36, .95), vec3(.1, .9, .7), .5 - src.y)*w; wsum += w;   // blue from the top, mint from the bottom
  }
  bc = wsum > 0. ? acc/wsum : PAINT;
}

vec3 photoBefore(vec2 q, float grain){
  return negative(texture(uImg, toUV(q)).rgb) + grain*.03;
}
// the colour film while it is shaken loose: slides, lags, beads up and flies off
float lipThin(float F){ return smoothstep(0., .03, F)*exp(-max(F - .03, 0.)/.05); }

// colour photo seen through a liquid-glass layer of thickness h and normal n
vec3 shadeLiquid(vec2 qs, vec3 n, float h){
  vec2 off = n.xy*(.07 + .06*h);
  vec3 cr = vivid(texture(uImg, toUV(qs - off*.92)).rgb);
  vec3 cg = vivid(texture(uImg, toUV(qs - off*1.05)).rgb);
  vec3 cb = vivid(texture(uImg, toUV(qs - off*1.2)).rgb);
  vec3 liquid = vec3(cr.r, cg.g, cb.b);
  liquid = mix(liquid, liquid*vec3(.7, 1.05, 1.12) + PAINT*.1, h*.55);
  float fres = pow(1. - n.z, 1.6);
  liquid += fres*vec3(.75, .86, 1.)*1.1;
  vec3 V = vec3(0, 0, 1);
  liquid += pow(max(dot(reflect(-L1, n), V), 0.), 70.)*1.3;
  liquid += pow(max(dot(reflect(-L2, n), V), 0.), 30.)*.35*vec3(.8, .9, 1.);
  liquid += smoothstep(.0, .5, h)*(1. - smoothstep(.5, 1., h))*max(dot(n.xy, -L1.xy), 0.)*.18;
  return liquid;
}

vec3 surfaceAt(vec2 q, vec3 paper){
  float m = smoothstep(.002, -.002, sdRound(q, vec2(uAsp*.5, .5), uRad));
  return mix(paper, photoBefore(q, 0.), m);
}

void main(){
  vec2 q = (gl_FragCoord.xy - uCenter)/uPH;
  vec2 hb = vec2(uAsp*.5, .5);
  float px = 1./uPH;
  float tau = uT - uFly;
  float grain = hash(gl_FragCoord.xy + uGrain) - .5;
  vec3 paper = uBg + grain*.006;

  float sd = sdRound(q, hb, uRad);
  float mask = smoothstep(px, -px, sd);

  // ---- photo + liquid ----
  vec3 photo = photoBefore(q, grain);
  float R = 0., amp = 0.;
  if (tau > 0.){
    float splat = .11*(1. - exp(-tau*20.));
    float flow  = 1.05*(1. - pow(1. - clamp(tau/1.7, 0., 1.), 1.6));
    float fill  = smoothstep(.75, 1.25, tau)*.8;
    R = splat + flow + fill;
    amp = min(R, .3);
  }
  if ((tau > 0. || uDrain > 0.) && uShed < .5){
    float e = 1.5*px;
    float F  = body(q, R, amp, tau);
    float Fx = body(q + vec2(e, 0.), R, amp, tau);
    float Fy = body(q + vec2(0., e), R, amp, tau);
    float h = lip(F);
    vec2 gh = vec2(lip(Fx) - h, lip(Fy) - h)/e;
    vec3 n = normalize(vec3(-gh*.03, 1.));
    float wet = smoothstep(-px, px, F);

    vec3 liquid = shadeLiquid(q, n, h);

    // soft contact shadow cast ahead of the front
    float Fs = body(q + vec2(-.007, .011), R, amp, tau);
    float shade = lip(Fs)*(1. - wet)*.22;
    photo = mix(photo*(1. - shade), liquid, wet);
  }
  vec3 col = mix(paper, photo, mask);

  // ---- shaken off: the colour film lags, beads up and flies past the card edge ----
  if (uShed > .5){
    float film, B; vec3 bc;
    shedField(q, film, B, bc);
    float G = smax(film, B, .05);                    // necks of paint stretch between film and blobs
    float wB = smoothstep(-.015, .015, B - film);
    // the film: liquid glass over the colour photo, with a rounded meniscus at every edge
    float h = lipThin(G);
    vec2 gh = vec2(dFdx(h), dFdy(h))/px;
    vec3 n = normalize(vec3(-gh*.02, 1.));
    vec3 filmCol = shadeLiquid(q - uSlosh, n, h);
    // the blobs: glossy beads of the paint they carry
    float hb = smoothstep(0., .03, G);
    vec2 gb = vec2(dFdx(hb), dFdy(hb))/px;
    vec3 nb = normalize(vec3(-gb*.025, 1.));
    vec3 V = vec3(0, 0, 1);
    vec3 dropCol = bc*(.6 + .5*nb.z) + PAINT*.08;
    dropCol += pow(1. - nb.z, 2.)*vec3(.6, .85, 1.)*.55;
    dropCol += pow(max(dot(reflect(-L1, nb), V), 0.), 60.)*1.3;
    col = mix(col, mix(filmCol, dropCol, wB), smoothstep(-px, px, G));
  }

  // ---- the thrown drop: blue glass bead with its shadow and caustic ----
  if (uT > 0. && tau < .09){
    float k = clamp(uT/uFly, 0., 1.);
    vec2 c = flyPos(uT);
    vec2 v = (c - flyPos(uT - .016))/.016;
    float sp = length(v);
    vec2 ax = sp > 1e-3 ? v/sp : vec2(0., 1.);
    float imp = smoothstep(0., .09, tau);                    // impact: flatten and hand over to the puddle
    float jig = sin(uT*38.)*exp(-uT*5.)*.12;
    float s = mix(1. + min(sp*.1, .4) + jig, .55, imp);
    float r = .05*(.72 + .38*sin(k*3.14159))*(1. + imp*.8);  // swells as it rises toward the viewer
    float lift = sin(k*3.14159)*(1. - imp);

    // soft shadow on the surface, with the light the bead focuses into it
    vec2 sc = c + vec2(.03, -.045)*(.25 + lift);
    float sdist = length((q - sc)/vec2(1.15, 1.))/(r*(1. + .7*lift));
    col *= 1. - (1. - smoothstep(.2, 1.25, sdist))*(.32 - .12*lift)*(1. - imp);
    float caus = exp(-pow(length(q - sc + vec2(.012, -.016)*(.4 + lift))/(r*.32), 2.));
    col += vec3(.3, .9, 1.)*caus*.5*(1. - imp);

    // the bead: refracts what is under it, blue deepens with thickness
    float e = 1.5*px;
    float D  = dropSD(q, c, ax, r, s);
    float h0 = beadH(D, r);
    float hx = beadH(dropSD(q + vec2(e, 0.), c, ax, r, s), r);
    float hy = beadH(dropSD(q + vec2(0., e), c, ax, r, s), r);
    vec3 n = normalize(vec3(-(hx - h0)/e, -(hy - h0)/e, 1.));
    float th = h0/r;
    vec2 off = n.xy*r*1.6;
    vec3 g = vec3(surfaceAt(q - off*.9, paper).r, surfaceAt(q - off, paper).g, surfaceAt(q - off*1.14, paper).b);
    // clear in the middle, deeper blue toward the rim where the light travels further
    g *= exp(-(1. - PAINT)*(.55 + 1.6*pow(1. - th, 2.))*1.25);
    g += PAINT*.22*th;                                  // the bead glows a little from within
    g = mix(g, PAINT*.3, pow(1. - n.z, 3.)*.55);
    vec3 V = vec3(0, 0, 1);
    g += smoothstep(.86, .93, dot(n, normalize(vec3(-.42, .5, .76))))*.55;          // softbox reflection
    g += pow(max(dot(reflect(-L1, n), V), 0.), 220.)*2.;                              // sharp glint
    g += pow(max(dot(n.xy, -L1.xy), 0.), 1.5)*(1. - n.z)*vec3(.45, .95, 1.)*.9;        // light focused on the far side
    col = mix(col, g, smoothstep(px, -px, D)*(1. - smoothstep(.6, 1., imp)));
  }

  outColor = vec4(col, 1.);
}
</script>

<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SPEED = reduced ? 2.5 : 1;
  const FLY = 0.5;
  const DONE = 1.5;
  const RADIUS = 40;
  const SWING = 0.19;   // one left-right cycle of the hand, seconds
  const BG = [14 / 255, 15 / 255, 19 / 255];
  const FOCUS_X = 0.56;  // keep the figure in frame when the sides get cropped

  const device = document.getElementById('device');
  const canvas = document.getElementById('gl');
  const btn = document.getElementById('pour');
  const hint = document.getElementById('hint');

  const gl = canvas.getContext('webgl2', { antialias: false });
  if (!gl) { document.getElementById('fallback').hidden = false; btn.hidden = true; return; }

  // ---- layout, in screen points: photo card fills the space above the button ----
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';
  document.body.appendChild(probe);
  const BTN_H = 56, SIDE = 16;
  let L = { W: 390, H: 844, cx: 0, cy: 0, w: 1, h: 1, bx: 0, by: 0 };
  let scale = 1, mobile = false;
  function layout() {
    mobile = innerWidth < 520;
    document.body.classList.toggle('mobile', mobile);
    let W = 390, H = 844, top = 62, bottom = 34;
    if (mobile) {
      const cs = getComputedStyle(probe);
      W = innerWidth; H = innerHeight;
      top = 16 + parseFloat(cs.paddingTop); bottom = 20 + parseFloat(cs.paddingBottom);
      device.style.width = W + 'px'; device.style.height = H + 'px';
    } else {
      device.style.width = W + 'px'; device.style.height = H + 'px';
      scale = Math.min(1, (innerHeight - 56) / H, (innerWidth - 56) / W);
    }
    const btnTop = H - bottom - BTN_H;
    btn.style.top = btnTop + 'px';
    const cardTop = top, cardBottom = btnTop - 16;
    hint.style.top = (cardTop + cardBottom) / 2 + 'px';
    L = { W, H, cx: W / 2, cy: (cardTop + cardBottom) / 2, w: W - SIDE * 2, h: cardBottom - cardTop, bx: W / 2, by: btnTop + BTN_H / 2 };
    if (mobile) scale = 1;
    placeDevice(0, 0, 0);
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
  }
  function placeDevice(x, y, r) {
    device.style.transform = mobile
      ? `translate(${x}px, ${y}px) rotate(${r}deg)`
      : `translate(-50%, -50%) translate(${x}px, ${y}px) rotate(${r}deg) scale(${scale})`;
  }
  addEventListener('resize', layout);
  layout();

  // ---- state ----
  const clock = () => performance.now() / 1000;
  const smooth = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); };
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
  let start = null;          // time of the throw
  let shedFrom = null;       // time the shake-off began
  let replayAt = null;
  let hintFrom = null;       // the "shake to restore" prompt is up
  let seed = 3.7, hit = [0.03, -0.06];
  let impactBuzzed = false;
  const slosh = { x: 0, y: 0, vx: 0, vy: 0 };
  let last = clock();

  function throwPaint() {
    seed = Math.random() * 40 + 1;
    hit = [(Math.random() - 0.5) * 0.12, -0.02 + (Math.random() - 0.5) * 0.12];
    start = clock();
    impactBuzzed = false;
    btn.disabled = true;
    btn.classList.add('kick');
    setTimeout(() => btn.classList.remove('kick'), 160);
    buzz(12);
  }
  function shakeOff() {
    shedFrom = clock();
    btn.disabled = true;
    buzz([90, 40, 120, 40, 160]);
  }
  function askToShake() {
    hintFrom = clock();
    btn.disabled = true;
    hint.classList.add('show');
    buzz(15);
  }
  btn.addEventListener('click', () => {
    if (hintFrom !== null || shedFrom !== null) return;
    if (start === null) throwPaint();
    else askToShake();
  });

  // phone motion: a light haptic tick on throw and impact, a hard shake on Continue
  function phoneMotion(now, t) {
    let x = 0, y = 0, r = 0;
    if (!reduced && start !== null && shedFrom === null) {
      const press = 1 - smooth(0, 0.09, t);
      const tau = t - FLY;
      const hit = tau > 0 ? Math.exp(-tau * 6.5) : 0;
      x += press * 0.9 * (Math.sin(now * 157) + 0.5 * Math.sin(now * 263));
      // the drop lands like a punch: a hard knock that rattles out
      x += hit * 10 * (Math.sin(tau * 88) + 0.35 * Math.sin(tau * 161));
      y += hit * 7 * Math.sin(tau * 70 + 1.2) + (tau > 0 ? 8 * Math.exp(-tau * 14) * smooth(0, 0.02, tau) : 0);
      r += hit * 1.6 * Math.sin(tau * 63);
    }
    if (shedFrom !== null) {
      // a hand shaking the phone left and right: hardest on the first swing, then dying out
      const ts = now - shedFrom;
      const k = reduced ? 0.25 : 1;
      const env = smooth(0, 0.035, ts) * Math.exp(-ts * 1.8) * (1 - smooth(0.8, 1.1, ts));
      const w = ts * Math.PI * 2 / SWING;
      x += k * env * 36 * Math.sin(w);
      y += k * env * 6 * Math.sin(w * 2);               // the wrist moves on an arc
      r += k * env * 5 * Math.sin(w + 0.35);
    }
    return { x, y, r };
  }

  function frame() {
    const now = clock();
    const dt = Math.min(0.05, now - last); last = now;
    let t = start === null ? -1 : (now - start) * SPEED;

    if (replayAt !== null && now >= replayAt) { replayAt = null; throwPaint(); t = 0; }
    if (start !== null && shedFrom === null && t > DONE && btn.disabled) {
      btn.disabled = false;
      btn.textContent = 'Restore';
    }
    if (hintFrom !== null && now - hintFrom > 1.0) {
      hintFrom = null;
      shakeOff();
      setTimeout(() => hint.classList.remove('show'), 220);
    }
    if (start !== null && !impactBuzzed && t > FLY) { impactBuzzed = true; buzz(30); }

    let shed = 0, shedT = 0;
    if (shedFrom !== null) {
      const ts = now - shedFrom;
      shed = 1;
      shedT = ts;
      if (ts > 1.15) {
        shedFrom = null; start = null; t = -1; shed = 0;
        btn.textContent = 'Bring to life';
        btn.disabled = false;
      }
    }

    const m = phoneMotion(now, t);
    placeDevice(m.x, m.y, m.r);

    // the film lags behind the phone like a liquid on a spring
    const tx = -m.x * 1.9 / L.h, ty = m.y * 1.9 / L.h;
    slosh.vx += ((tx - slosh.x) * 220 - slosh.vx * 12) * dt;
    slosh.vy += ((ty - slosh.y) * 220 - slosh.vy * 12) * dt;
    slosh.x += slosh.vx * dt; slosh.y += slosh.vy * dt;

    const k = canvas.width / L.W;   // device px per screen point
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform1i(U.uImg, 0);
    gl.uniform2f(U.uCenter, L.cx * k, (L.H - L.cy) * k);
    gl.uniform1f(U.uPH, L.h * k);
    gl.uniform1f(U.uAsp, L.w / L.h);
    gl.uniform1f(U.uImgAsp, imgAsp);
    gl.uniform1f(U.uFocusX, FOCUS_X);
    gl.uniform3f(U.uBg, BG[0], BG[1], BG[2]);
    gl.uniform1f(U.uRad, RADIUS / L.h);
    gl.uniform2f(U.uBtn, (L.bx - L.cx) / L.h, -(L.by - L.cy) / L.h);
    gl.uniform2f(U.uHit, hit[0], hit[1]);
    gl.uniform1f(U.uT, t);
    gl.uniform1f(U.uFly, FLY);
    gl.uniform1f(U.uDrain, 0);
    gl.uniform1f(U.uSeed, seed);
    gl.uniform1f(U.uGrain, Math.floor(now * 24) % 97);
    gl.uniform1f(U.uShed, shed);
    gl.uniform1f(U.uShedT, shedT);
    gl.uniform1f(U.uSwing, SWING);
    gl.uniform2f(U.uSlosh, shed ? slosh.x : 0, shed ? slosh.y : 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
